name: Rebuild CPython

on:
  workflow_dispatch:

jobs:
  native-runtime:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/build-python.sh
      - run: Scripts/verify-python-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YtdlpKit2-CPython-3.14
          path: Native/CPython/Python.xcframework
